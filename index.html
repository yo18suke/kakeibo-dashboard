<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家計簿ダッシュボード</title>
<style>
  :root{
    --bg:#faf6ee; --card:#ffffff; --ink:#22303e; --sub:#8a7f6a;
    --navy:#35536f; --salmon:#da7057; --blue:#3f7fbf; --line:#e7ddcb;
    --warn:#bf3b2b; --good:#1d7a4f; --chip:#f3ecdd;
    --serif:"Hiragino Mincho ProN","Hiragino Mincho Pro","Yu Mincho","YuMincho","Noto Serif JP",serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; padding:22px 16px 48px;}
  .wrap{max-width:760px; margin:0 auto;}
  header{margin-bottom:14px;}
  h1{font-family:var(--serif); font-size:27px; font-weight:700; letter-spacing:.02em;}
  .subrow{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:5px;}
  .fetched{color:var(--sub); font-size:12.5px;}
  .reloadbtn{padding:6px 14px; border:1.5px solid var(--navy); color:var(--navy); background:transparent; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer;}
  h2.sec{font-family:var(--serif); font-size:19px; font-weight:700; margin:22px 0 10px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:14px;}
  .card h2{font-size:15.5px; font-weight:700; margin-bottom:12px;}
  .remain-label{font-size:13px; color:var(--sub); margin-bottom:2px;}
  .remain-big{font-family:var(--serif); font-size:38px; font-weight:700; line-height:1.15;}
  .catrow{margin-top:16px;}
  .catrow .r1{display:flex; justify-content:space-between; align-items:baseline;}
  .catrow .name{font-size:14.5px; font-weight:700;}
  .catrow .remain{font-size:14.5px; font-weight:700;}
  .track{height:9px; background:#efe7d6; border-radius:5px; overflow:hidden; margin:7px 0 5px;}
  .track > div{height:100%; background:var(--navy); border-radius:5px;}
  .track > div.over{background:var(--warn);}
  .cap{font-size:12.5px; color:var(--sub);}
  .proj{margin-top:16px; font-size:13.5px; line-height:1.7; border-top:1px solid var(--line); padding-top:12px;}
  .proj .warn{color:var(--warn); font-weight:700;}
  .proj .good{color:var(--good); font-weight:700;}
  .weekhead{display:flex; justify-content:space-between; align-items:baseline;}
  .weekhead .name{font-size:15px; font-weight:700;}
  .weekhead .remain{font-size:15px; font-weight:700;}
  .weeksub{font-size:13px; color:var(--ink); margin-top:3px;}
  .chart{width:100%; height:auto; display:block; margin-top:6px;}
  .chartcap{font-size:11.5px; color:var(--sub); line-height:1.6; margin-top:4px;}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th,td{padding:7px 4px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top;}
  td.num, th.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .totalrow{display:flex; justify-content:space-between; align-items:baseline;}
  .totalrow .t{font-size:13px; color:var(--sub);}
  .totalrow .v{font-family:var(--serif); font-size:26px; font-weight:700;}
  .prevnote{font-size:12.5px; color:var(--sub); margin:2px 0 12px;}
  .hbar-row{margin:9px 0;}
  .hbar-row .r1{display:flex; justify-content:space-between; font-size:13.5px;}
  .hbar-row .track{margin:4px 0 0;}
  .payerline{font-size:13.5px; margin-top:14px; border-top:1px solid var(--line); padding-top:12px;}
  .settle{margin-top:14px; border-top:1px solid var(--line); padding-top:12px;}
  .settle .s-title{font-size:13px; color:var(--sub); margin-bottom:3px;}
  .settle .s-big{font-size:17px; font-weight:700;}
  .settle .s-note{font-size:12.5px; color:var(--sub); line-height:1.7; margin-top:4px;}
  .mrow{display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:9px 2px; border-bottom:1px solid var(--line);}
  .mrow:last-child{border-bottom:none;}
  .mrow .m{font-size:14px;}
  .mrow.now .m{font-weight:700;}
  .mrow .vals{font-size:13px; text-align:right; white-space:nowrap;}
  .mrow .vals .fd{color:var(--sub); margin-left:10px; font-size:12.5px;}
  .rec{display:flex; align-items:baseline; gap:8px; padding:8px 2px; border-bottom:1px solid var(--line); font-size:13.5px;}
  .rec:last-child{border-bottom:none;}
  .rec .d{color:var(--sub); font-size:12.5px; white-space:nowrap; min-width:34px;}
  .rec .chip{background:var(--chip); border-radius:5px; padding:1px 7px; font-size:12px; white-space:nowrap;}
  .rec .nm{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .rec .who{color:var(--sub); font-size:12.5px; white-space:nowrap;}
  .rec .amt{font-weight:700; white-space:nowrap;}
  details{border:1px solid var(--line); border-radius:12px; background:var(--card); padding:13px 18px; margin-bottom:10px;}
  details summary{cursor:pointer; font-size:14.5px; font-weight:700; list-style:none;}
  details summary::-webkit-details-marker{display:none;}
  details summary::before{content:"▶ "; font-size:11px; color:var(--sub);}
  details[open ] summary::before{content:"▼ ";}
  .note{font-size:13px; line-height:1.85; white-space:pre-wrap; margin-top:8px;}
  .note h4{font-size:12.5px; color:var(--sub); margin:12px 0 2px;}
  .goalcard .g-title{font-size:14.5px; font-weight:700; margin-bottom:6px;}
  .editrow{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--line);}
  .editrow label{font-size:14.5px; font-weight:700;}
  .editrow .inp{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--sub);}
  .editrow input{width:110px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:15px; text-align:right; background:#fdfbf7;}
  .savebtn{margin-top:14px; padding:10px 22px; background:var(--navy); color:#fff; border:none; border-radius:8px; font-size:14.5px; font-weight:700; cursor:pointer;}
  .editnote{font-size:12px; color:var(--sub); line-height:1.7; margin-top:10px;}
  #tabs{position:sticky; top:0; z-index:10; background:var(--bg); display:flex; gap:6px; overflow-x:auto; padding:10px 2px; margin-bottom:4px; -webkit-overflow-scrolling:touch;}
  #tabs button{flex:0 0 auto; padding:7px 14px; border:1px solid var(--line); background:#fff; color:var(--sub); border-radius:999px; font-size:13.5px; cursor:pointer;}
  #tabs button.on{background:var(--ink); color:#fff; border-color:var(--ink); font-weight:700;}
  .buddy{display:flex; gap:14px; align-items:center; cursor:pointer; user-select:none; margin-bottom:14px; background:transparent; border:none; box-shadow:none; padding:4px 2px;}
  .buddy img{width:104px; height:auto; flex:0 0 auto;}
  .buddy .bubble{position:relative; background:#fff; border:1.5px solid var(--line); border-radius:14px; padding:12px 14px; flex:1;}
  .buddy .bubble::before{content:""; position:absolute; left:-9px; top:50%; margin-top:-7px; border:7px solid transparent; border-right-color:var(--line); border-left:0;}
  .buddy .bubble p{font-size:15px; line-height:1.65; font-weight:600;}
  .buddy .hint{display:block; margin-top:6px; font-size:11px; color:var(--sub); font-weight:400;}
  .buddy.care .bubble{background:#fff; border-color:var(--line);}
  .buddy.care .bubble::before{border-right-color:var(--line);}
  .buddy.good .bubble{background:#fff; border-color:var(--line);}
  .buddy.good .bubble::before{border-right-color:var(--line);}
  .buddy.pop img{animation:pop .3s ease;}
  @keyframes pop{0%{transform:scale(1);}40%{transform:scale(1.12) rotate(-3deg);}100%{transform:scale(1);}}
  .err{background:#fff1f1; border:1px solid #f3c2c2; color:#8c2b2b; padding:14px; border-radius:12px; font-size:13.5px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">家計簿ダッシュボード</h1>
    <div class="subrow">
      <div class="fetched" id="fetched">読み込み中…</div>
      <button class="reloadbtn" id="reload">今すぐ更新</button>
    </div>
  </header>
  <section id="buddy" class="card buddy" style="display:none" title="タップでコメントが変わるよ">
    <img id="buddy-img" alt="家計簿キャラ">
    <div class="bubble"><p id="buddy-text"></p><span class="hint">タップでコメントが変わるよ</span></div>
  </section>
  <nav id="tabs"></nav>
  <div id="app"></div>
  <div id="error"></div>
</div>
<script>
const SHEET_ID = "1qbglQTSzy5kGz3-nZnGTn-zq_NlNjd4Y2MbrCMWXSmU";
const BUDGET_START = "2026-11-01";
const DEFAULT_TARGETS = { foodMonthly: 45000, dailyMonthly: 12999, foodWeekly: 10000, dailyWeekly: 3000 };
let targets = { ...DEFAULT_TARGETS };
try {
  const saved = JSON.parse(localStorage.getItem("kakeibo-targets") || "null");
  if (saved) targets = { ...DEFAULT_TARGETS, ...saved };
} catch (e) {}

const yen = n => "¥" + Math.round(n).toLocaleString("ja-JP");
const pad = n => String(n).padStart(2, "0");
const fmtDate = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const fmtMD = d => (d.getMonth() + 1) + "/" + d.getDate();
const monthKey = d => d.getFullYear() + "-" + pad(d.getMonth() + 1);
function mondayOf(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return x;
}
function fmtWan(v) {
  if (v <= 0) return "";
  if (v >= 10000) { const x = v / 10000; return (Math.round(x * 10) / 10).toString().replace(/\.0$/, "") + "万"; }
  const x = v / 1000; return (Math.round(x * 10) / 10).toString().replace(/\.0$/, "") + "千";
}

async function fetchTab(sheetName) {
  const url = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=out:json&sheet=" + encodeURIComponent(sheetName);
  const res = await fetch(url);
  const text = await res.text();
  return JSON.parse(text.substring(text.indexOf("{"), text.lastIndexOf("}") + 1));
}

async function load() {
  const json = await fetchTab("記録");
  const recs = [];
  for (const row of json.table.rows) {
    const c = row.c;
    if (!c || !c[0] || !c[0].v) continue;
    const m = /^Date\((\d+),(\d+),(\d+)\)/.exec(String(c[0].v));
    if (!m) continue;
    recs.push({
      date: new Date(+m[1], +m[2], +m[3]),
      item: c[1] ? (c[1].v || "") : "",
      name: c[2] ? (c[2].v || "") : "",
      payer: c[3] ? (c[3].v || "") : "",
      amount: c[4] ? (+c[4].v || 0) : 0
    });
  }
  recs.sort((a, b) => a.date - b.date);
  let reviews = [];
  try {
    const rj = await fetchTab("振り返り");
    reviews = rj.table.rows.map(r => (r.c || []).map(c => c ? (c.f || c.v || "") : ""));
  } catch (e) {}
  return { recs, reviews };
}

let DATA = { recs: [], reviews: [] };
let selected = null;
const sumOf = arr => arr.reduce((a, r) => a + r.amount, 0);
function groupBy(arr, keyFn) {
  const m = {};
  for (const r of arr) { const k = keyFn(r); m[k] = (m[k] || 0) + r.amount; }
  return m;
}
function monthKeys(recs) { return [...new Set(recs.map(r => monthKey(r.date)))].sort(); }
function reviewIdx(reviews, key) { return reviews.findIndex(r => (r[0] || "").trim() === key); }

function last10Weeks(recs, item) {
  const map = new Map();
  for (const r of recs) {
    if (r.item !== item) continue;
    const k = fmtDate(mondayOf(r.date));
    map.set(k, (map.get(k) || 0) + r.amount);
  }
  const cur = mondayOf(new Date());
  const weeks = [];
  for (let i = 9; i >= 0; i--) {
    const d = new Date(cur); d.setDate(d.getDate() - i * 7);
    const k = fmtDate(d);
    weeks.push({ start: d, key: k, amount: map.get(k) || 0, isCurrent: i === 0 });
  }
  return weeks;
}

function monthWeeks(mRecs, item, mk) {
  const map = new Map();
  for (const r of mRecs) {
    if (r.item !== item) continue;
    const k = fmtDate(mondayOf(r.date));
    map.set(k, (map.get(k) || 0) + r.amount);
  }
  return [...map.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1)
    .map(([k, v]) => ({ start: new Date(k + "T00:00:00"), key: k, amount: v, isCurrent: false }));
}

function chartSVG(weeks, weeklyBudget) {
  const W = 720, H = 185, PL = 6, PR = 6, PT = 20, PB = 26;
  const maxV = Math.max(weeklyBudget || 0, ...weeks.map(w => w.amount), 1) * 1.18;
  const iw = W - PL - PR, ih = H - PT - PB, bw = iw / weeks.length;
  let s = "";
  weeks.forEach((w, i) => {
    const cx = PL + i * bw + bw / 2;
    if (w.amount > 0) {
      const h = (w.amount / maxV) * ih;
      const x = PL + i * bw + bw * 0.24, y = PT + ih - h;
      s += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + (bw * 0.52).toFixed(1) + '" height="' + h.toFixed(1) + '" rx="3" fill="var(--salmon)"' + (w.isCurrent ? ' stroke="var(--ink)" stroke-width="1.6"' : '') + '/>';
      s += '<text x="' + cx + '" y="' + (y - 5) + '" font-size="12" fill="#8a7f6a" text-anchor="middle">' + fmtWan(w.amount) + '</text>';
    } else {
      s += '<circle cx="' + cx + '" cy="' + (PT + ih - 2) + '" r="2.4" fill="#8a7f6a"/>';
    }
    s += '<text x="' + cx + '" y="' + (H - 7) + '" font-size="12" fill="' + (w.isCurrent ? '#22303e' : '#8a7f6a') + '" font-weight="' + (w.isCurrent ? '700' : '400') + '" text-anchor="middle" ' + (w.isCurrent ? 'text-decoration="underline"' : '') + '>' + fmtMD(w.start) + '</text>';
  });
  const pts = [];
  weeks.forEach((w, i) => { if (w.key >= BUDGET_START) pts.push(PL + i * bw + bw / 2); });
  if (pts.length && weeklyBudget > 0) {
    const y = PT + ih - (weeklyBudget / maxV) * ih;
    const x1 = pts[0] - bw * 0.3, x2 = pts[pts.length - 1] + bw * 0.3;
    s += '<line x1="' + x1 + '" y1="' + y + '" x2="' + x2 + '" y2="' + y + '" stroke="var(--blue)" stroke-width="2.2" stroke-dasharray="6 5"/>';
    pts.forEach(x => { s += '<circle cx="' + x + '" cy="' + y + '" r="3.2" fill="var(--blue)"/>'; });
  }
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '">' + s + '</svg>';
}

function weekCard(item, weeklyTarget, mRecs, isCurrentView, mk) {
  let weeks, sub, remain;
  if (isCurrentView) {
    weeks = last10Weeks(DATA.recs, item);
    const cur = weeks[weeks.length - 1];
    const end = new Date(cur.start); end.setDate(end.getDate() + 6);
    sub = '今週（' + fmtMD(cur.start) + '〜' + fmtMD(end) + '）：' + yen(cur.amount) + ' / 週予算 ' + yen(weeklyTarget);
    remain = weeklyTarget - cur.amount;
  } else {
    weeks = monthWeeks(mRecs, item, mk);
    sub = mk.split('-').map(Number)[1] + '月の週別実績';
    remain = null;
  }
  const pct = isCurrentView ? Math.min(100, (weeks[weeks.length - 1].amount / weeklyTarget) * 100) : 0;
  return '<div class="card"><div class="weekhead"><div class="name">' + item + '</div>' +
    (remain !== null ? '<div class="remain">あと ' + yen(remain) + '</div>' : '') + '</div>' +
    '<div class="weeksub">' + sub + '</div>' +
    (isCurrentView ? '<div class="track"><div style="width:' + pct + '%"></div></div>' : '') +
    chartSVG(weeks, weeklyTarget) +
    '<div class="chartcap">朱色の棒は週（月曜開始）の実績、破線は週予算 ' + yen(weeklyTarget) + '。棒が線を超えた週が予算オーバーです。予算は2026年11月から設定のため、それ以前の週に線はありません。枠付きは今週。</div></div>';
}

function settleBlock(byPayer, label) {
  const payers = Object.keys(byPayer);
  if (payers.length < 2) return "";
  const sorted = payers.slice().sort((a, b) => byPayer[b] - byPayer[a]);
  const hi = sorted[0], lo = sorted[1], diff = byPayer[hi] - byPayer[lo];
  const payerLine = payers.slice().sort((a, b) => byPayer[b] - byPayer[a]).map(p => p + ' ' + yen(byPayer[p])).join(' ／ ');
  if (diff === 0) return '<div class="settle"><div class="s-title">立て替えの精算（' + label + '）</div><div class="s-big">精算は不要</div><div class="s-note">内訳：' + payerLine + '</div></div>';
  return '<div class="settle"><div class="s-title">立て替えの精算（' + label + '）</div>' +
    '<div class="s-big">' + lo + ' → ' + hi + ' へ ' + yen(Math.round(diff / 2)) + '</div>' +
    '<div class="s-note">' + hi + 'の方が ' + yen(diff) + ' 多く立て替えているため、折半すると' + lo + 'が' + hi + 'に ' + yen(Math.round(diff / 2)) + ' 払います。<br>内訳：' + payerLine + '（支払元別合計を折半して計算）</div></div>';
}

function breakdownCard(mRecs, mk, isCurrentView) {
  const total = sumOf(mRecs);
  const byItem = groupBy(mRecs, r => r.item);
  const byPayer = groupBy(mRecs, r => r.payer);
  const [y, mo] = mk.split('-').map(Number);
  let prevNote = "";
  if (isCurrentView) {
    const keys = monthKeys(DATA.recs);
    const prevKey = keys[keys.indexOf(mk) - 1];
    if (prevKey) {
      const prevTotal = sumOf(DATA.recs.filter(r => monthKey(r.date) === prevKey));
      const [py, pmo] = prevKey.split('-').map(Number);
      const now = new Date();
      prevNote = '<div class="prevnote">前月（' + py + '年' + pmo + '月）は ' + yen(prevTotal) + '、差は ' + (total - prevTotal >= 0 ? '+' : '−') + yen(Math.abs(total - prevTotal)).slice(1) + '。1日あたり ' + yen(total / now.getDate()) + '</div>';
    }
  }
  const maxItem = Math.max(...Object.values(byItem), 1);
  const hbars = Object.entries(byItem).sort((a, b) => b[1] - a[1]).map(([k, v]) =>
    '<div class="hbar-row"><div class="r1"><span>' + k + '</span><span>' + yen(v) + '</span></div><div class="track"><div style="width:' + (v / maxItem * 100) + '%"></div></div></div>').join("");
  const payerLine = Object.entries(byPayer).sort((a, b) => b[1] - a[1]).map(([p, v]) => p + ' ' + yen(v)).join(' ／ ');
  return '<div class="card"><div class="totalrow"><div class="t">総支出</div><div class="v">' + yen(total) + '</div></div>' + prevNote + hbars +
    '<div class="payerline">支払元：' + payerLine + '</div>' +
    settleBlock(byPayer, isCurrentView ? '今月分' : mo + '月分') + '</div>';
}

function trendCard() {
  const keys = monthKeys(DATA.recs);
  const nowKey = monthKey(new Date());
  const rows = keys.slice().reverse().map(k => {
    const mr = DATA.recs.filter(r => monthKey(r.date) === k);
    const bi = groupBy(mr, r => r.item);
    const [y, mo] = k.split('-').map(Number);
    return '<div class="mrow' + (k === nowKey ? ' now' : '') + '"><div class="m">' + y + '年' + mo + '月' + (k === nowKey ? '（今月）' : '') + '</div>' +
      '<div class="vals">総支出 ' + yen(sumOf(mr)) + '<span class="fd">食料品＋日用品 ' + yen((bi['食料品'] || 0) + (bi['日用品'] || 0)) + '</span></div></div>';
  }).join("");
  return '<h2 class="sec">月別の推移</h2><div class="card">' + rows + '</div>';
}

function recordsCard(recs, limit) {
  const rows = recs.slice(-limit).reverse().map(r =>
    '<div class="rec"><span class="d">' + fmtMD(r.date) + '</span><span class="chip">' + r.item + '</span><span class="nm">' + (r.name ? r.name : '（名称なし）') + '</span><span class="who">' + r.payer + '</span><span class="amt">' + yen(r.amount) + '</span></div>').join("");
  return '<h2 class="sec">直近の記録</h2><div class="card">' + rows + '</div>';
}

function reviewSection(mk) {
  const { reviews } = DATA;
  const idx = reviewIdx(reviews, mk);
  if (idx < 0) return "";
  const prev = idx > 0 ? reviews[idx - 1] : null;
  const [y, mo] = mk.split('-').map(Number);
  let html = '<h2 class="sec">振り返りと目標</h2>';
  if (prev && prev[4]) {
    const [py, pmo] = (prev[0] || '').split('-').map(Number);
    html += '<div class="card goalcard"><div class="g-title">今月の目標（' + py + '年' + pmo + '月の振り返りより）</div><div class="note">' + prev[4] + '</div></div>';
  }
  const keys = monthKeys(DATA.recs).slice().reverse();
  for (const k of keys) {
    if (k >= mk) continue;
    const i2 = reviewIdx(reviews, k);
    if (i2 < 0) continue;
    const r = reviews[i2];
    if (!r[2] && !r[3] && !r[5]) continue;
    const [yy, mm] = k.split('-').map(Number);
    html += '<details><summary>' + yy + '年' + mm + '月の振り返り</summary><div class="note">' +
      (r[2] ? '<h4>寺本の感想</h4>' + r[2] : '') +
      (r[3] ? '<h4>三代の感想</h4>' + r[3] : '') +
      (r[5] ? '<h4>FPアドバイス</h4>' + r[5] : '') + '</div></details>';
  }
  return html;
}

function editCard() {
  const row = (id, label, v) => '<div class="editrow"><label>' + label + '</label><div class="inp"><input id="' + id + '" type="number" value="' + v + '">円</div></div>';
  return '<h2 class="sec">目標の編集</h2><div class="card">' +
    row('t-foodMonthly', '食料品（月）', targets.foodMonthly) +
    row('t-dailyMonthly', '日用品（月）', targets.dailyMonthly) +
    row('t-foodWeekly', '食料品（週予算）', targets.foodWeekly) +
    row('t-dailyWeekly', '日用品（週予算）', targets.dailyWeekly) +
    '<button class="savebtn" id="t-save">目標を保存</button>' +
    '<div class="editnote">月目標の初期値はスプレッドシートの記載（振り返りタブの今月の目標）です。週予算の初期値は月目標を週割りにした目安で、週次グラフの線になります。変更はこの端末にだけ保存されます。</div></div>';
}

function renderMonth(mk) {
  const now = new Date();
  const isCurrent = mk === monthKey(now);
  const mRecs = DATA.recs.filter(r => monthKey(r.date) === mk);
  const [y, mo] = mk.split('-').map(Number);
  document.getElementById("title").textContent = y + '年' + mo + '月の' + (isCurrent ? '予実' : '実績');
  let html = "";
  if (isCurrent) {
    const foodUsed = sumOf(mRecs.filter(r => r.item === '食料品'));
    const dailyUsed = sumOf(mRecs.filter(r => r.item === '日用品'));
    const foodRemain = targets.foodMonthly - foodUsed;
    const dailyRemain = targets.dailyMonthly - dailyUsed;
    const dim = new Date(y, mo, 0).getDate();
    const elapsed = now.getDate();
    const foodProj = Math.round(foodUsed / elapsed * dim);
    const dailyProj = Math.round(dailyUsed / elapsed * dim);
    const catRow = (name, used, target, remain) => {
      const pct = Math.min(100, used / target * 100);
      return '<div class="catrow"><div class="r1"><span class="name">' + name + '</span><span class="remain">あと ' + yen(remain) + '</span></div>' +
        '<div class="track"><div class="' + (remain < 0 ? 'over' : '') + '" style="width:' + pct + '%"></div></div>' +
        '<div class="cap">' + yen(used) + ' / 目標 ' + yen(target) + '（' + Math.round(used / target * 100) + '%消化）</div></div>';
    };
    html += '<div class="card"><div class="remain-label">今月あと使える額（食料品＋日用品の目標まで）</div>' +
      '<div class="remain-big">' + yen(foodRemain + dailyRemain) + '</div>' +
      catRow('食料品', foodUsed, targets.foodMonthly, foodRemain) +
      catRow('日用品', dailyUsed, targets.dailyMonthly, dailyRemain) +
      '<div class="proj">月末見込みは食料品 ' + yen(foodProj) + '・日用品 ' + yen(dailyProj) + '。' +
      (dailyProj > targets.dailyMonthly ? '<span class="warn">日用品はこのペースだと目標を超えそうです。</span>' : '') +
      (foodProj > targets.foodMonthly ? '<span class="warn">食料品はこのペースだと目標を超えそうです。</span>' : '') +
      (dailyProj <= targets.dailyMonthly && foodProj <= targets.foodMonthly ? '<span class="good">このペースなら目標内です。</span>' : '') +
      '（' + elapsed + '日経過・残り' + (dim - elapsed) + '日）</div></div>';
  } else {
    const total = sumOf(mRecs);
    html += '<div class="card"><div class="remain-label">' + y + '年' + mo + '月の総支出</div><div class="remain-big">' + yen(total) + '</div></div>';
  }
  html += '<h2 class="sec">週次の予実</h2>' +
    weekCard('食料品', targets.foodWeekly, mRecs, isCurrent, mk) +
    weekCard('日用品', targets.dailyWeekly, mRecs, isCurrent, mk);
  html += '<h2 class="sec">' + (isCurrent ? '今月' : mo + '月') + 'の内訳</h2>' + breakdownCard(mRecs, mk, isCurrent);
  html += trendCard();
  html += recordsCard(isCurrent ? DATA.recs : mRecs, 12);
  html += reviewSection(mk);
  if (isCurrent) html += editCard();
  document.getElementById("app").innerHTML = html;
  const saveBtn = document.getElementById("t-save");
  if (saveBtn) saveBtn.addEventListener("click", () => {
    const ids = { foodMonthly: 't-foodMonthly', dailyMonthly: 't-dailyMonthly', foodWeekly: 't-foodWeekly', dailyWeekly: 't-dailyWeekly' };
    for (const k of Object.keys(ids)) {
      const v = parseInt(document.getElementById(ids[k]).value, 10);
      if (!isNaN(v) && v > 0) targets[k] = v;
    }
    localStorage.setItem("kakeibo-targets", JSON.stringify(targets));
    render();
  });
}

function renderAll() {
  document.getElementById("title").textContent = '家計簿ダッシュボード（全体）';
  const byItem = groupBy(DATA.recs, r => r.item);
  const byPayer = groupBy(DATA.recs, r => r.payer);
  const maxItem = Math.max(...Object.values(byItem), 1);
  const hbars = Object.entries(byItem).sort((a, b) => b[1] - a[1]).map(([k, v]) =>
    '<div class="hbar-row"><div class="r1"><span>' + k + '</span><span>' + yen(v) + '</span></div><div class="track"><div style="width:' + (v / maxItem * 100) + '%"></div></div></div>').join("");
  document.getElementById("app").innerHTML =
    trendCard() +
    '<h2 class="sec">全期間の内訳</h2><div class="card"><div class="totalrow"><div class="t">総支出（全期間）</div><div class="v">' + yen(sumOf(DATA.recs)) + '</div></div>' + hbars +
    '<div class="payerline">支払元：' + Object.entries(byPayer).sort((a, b) => b[1] - a[1]).map(([p, v]) => p + ' ' + yen(v)).join(' ／ ') + '</div>' +
    settleBlock(byPayer, '全期間') + '</div>' +
    recordsCard(DATA.recs, 12);
}

const STATE_START = { good: 0, care: 1, normal: 6 };
function buddyStart() { return STATE_START[buddyState] || 0; }
let buddyState = "normal", buddyIdx = 0, buddyMsgs = [];

function computeBuddy() {
  const now = new Date();
  const cm = DATA.recs.filter(r => monthKey(r.date) === monthKey(now));
  const cw = fmtDate(mondayOf(now));
  const weekRecs = DATA.recs.filter(r => fmtDate(mondayOf(r.date)) === cw && (r.item === "食料品" || r.item === "日用品"));
  const weekUsed = sumOf(weekRecs);
  const weekBudget = targets.foodWeekly + targets.dailyWeekly;
  const weekRemain = weekBudget - weekUsed;
  const daysLeft = 7 - ((now.getDay() + 6) % 7);
  const dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const foodUsed = sumOf(cm.filter(r => r.item === "食料品"));
  const dailyUsed = sumOf(cm.filter(r => r.item === "日用品"));
  const foodRemain = targets.foodMonthly - foodUsed;
  const dailyRemain = targets.dailyMonthly - dailyUsed;
  const foodProj = foodUsed > 0 ? Math.round(foodUsed / now.getDate() * dim) : 0;
  const dailyProj = dailyUsed > 0 ? Math.round(dailyUsed / now.getDate() * dim) : 0;
  const paceOver = foodProj > targets.foodMonthly || dailyProj > targets.dailyMonthly;
  let state, msgs;
  if (weekRemain < 0 || paceOver) {
    state = "care";
    msgs = [
      "今週は予算を超えたけど、記録して見える化できてるのが大事だよ📝",
      "ペースは少し速めだね。でも早めに気づけたのが大きいよ👀 日用品の月末見込みは " + yen(dailyProj) + " だよ",
      "節約がんばってくれてありがとう🌷 無理のない範囲でいこ"
    ];
    if (weekRemain >= 0) msgs[0] = "今週は残り " + yen(weekRemain) + "。あと" + daysLeft + "日、ゆっくりペースでいこ🐢";
  } else if (weekRemain >= weekBudget * 0.3) {
    state = "good";
    msgs = [
      "今週は残り " + yen(weekRemain) + "！いいペースだね、その調子！🎉",
      "今月は食料品が残り " + yen(foodRemain) + "、日用品が残り " + yen(dailyRemain) + "。がんばりが数字に見えてるよ✨",
      "おつかれさま！🍵 無理なく続いてるのが一番すごいよ"
    ];
  } else {
    state = "normal";
    msgs = [
      "今週は残り " + yen(weekRemain) + " だよ。あと" + daysLeft + "日、1日あたり約 " + yen(Math.max(0, Math.floor(weekRemain / daysLeft))) + " が目安だね🧮",
      "今月は食料品が残り " + yen(foodRemain) + "、日用品が残り " + yen(dailyRemain) + " だよ📊",
      "記録が続いてるね。見える化できてるだけで前進だよ🌱"
    ];
  }
  if (weekUsed === 0 && state !== "care") msgs.unshift("今週はまだ記録がないよ。最初の一件を入れたら週の予算が見えてくるよ📝");
  return { state, msgs };
}

function renderBuddy() {
  const el = document.getElementById("buddy");
  if (!DATA.recs.length) { el.style.display = "none"; return; }
  const b = computeBuddy();
  if (b.state !== buddyState) { buddyState = b.state; buddyIdx = 0; }
  buddyMsgs = b.msgs;
  el.className = "card buddy " + buddyState;
  el.style.display = "flex";
  document.getElementById("buddy-img").src = CHAR_CYCLE[(buddyStart() + buddyIdx) % CHAR_CYCLE.length];
  document.getElementById("buddy-text").textContent = buddyMsgs[buddyIdx % buddyMsgs.length];
}

document.getElementById("buddy").addEventListener("click", () => {
  buddyIdx++;
  const el = document.getElementById("buddy");
  document.getElementById("buddy-img").src = CHAR_CYCLE[(buddyStart() + buddyIdx) % CHAR_CYCLE.length];
  document.getElementById("buddy-text").textContent = buddyMsgs[buddyIdx % buddyMsgs.length];
  el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
});

function renderTabs() {
  const keys = monthKeys(DATA.recs);
  const nowKey = monthKey(new Date());
  const tabs = ['<button data-k="all" class="' + (selected === 'all' ? 'on' : '') + '">全体</button>']
    .concat(keys.map(k => {
      const [y, mo] = k.split("-").map(Number);
      const label = (y !== new Date().getFullYear() ? y + '年' : '') + mo + '月' + (k === nowKey ? '（今月）' : '');
      return '<button data-k="' + k + '" class="' + (selected === k ? 'on' : '') + '">' + label + '</button>';
    })).join("");
  document.getElementById("tabs").innerHTML = tabs;
  document.querySelectorAll("#tabs button").forEach(b => b.addEventListener("click", () => {
    selected = b.dataset.k;
    location.hash = selected;
    render();
  }));
}

function render() {
  renderTabs();
  if (selected === 'all') renderAll(); else renderMonth(selected);
  renderBuddy();
  const now = new Date();
  document.getElementById("fetched").textContent = "データ取得：" + (now.getMonth() + 1) + "/" + now.getDate() + " " + pad(now.getHours()) + ":" + pad(now.getMinutes()) + "（全" + DATA.recs.length + "件）";
}

async function init() {
  try {
    DATA = await load();
    const keys = monthKeys(DATA.recs);
    const h = (location.hash || "").replace("#", "");
    selected = (h === 'all' || keys.includes(h)) ? h : monthKey(new Date());
    if (!keys.includes(selected) && selected !== 'all') selected = keys[keys.length - 1] || 'all';
    render();
  } catch (e) {
    document.getElementById("error").innerHTML = '<div class="err">データを読み込めませんでした。スプレッドシートの共有設定（リンクを知っている全員が閲覧可）が必要です。</div>';
    document.getElementById("fetched").textContent = "読み込み失敗";
  }
}
document.getElementById("reload").addEventListener("click", init);
init();
</script>
